version: "3.9"

# =============================================================================
# eval-engine Multi-Agent Oversight Pipeline
# Docker Compose — Redis + Celery Workers + Flower Monitor
#
# Services:
#   redis       — Message broker + result backend (Celery)
#   worker      — Celery worker executing debate rounds (A→B→C)
#   flower      — Celery task monitor (optional, web UI on :5555)
#
# Usage:
#   # Start full stack
#   docker compose up -d
#
#   # Scale workers (4 parallel debate rounds)
#   docker compose up -d --scale worker=4
#
#   # Dry-run mode (no API calls, zero cost)
#   DRY_RUN=true docker compose up -d
#
#   # View logs
#   docker compose logs -f worker
#
#   # Stop everything
#   docker compose down
#
# Environment:
#   Copy .env.example to .env and set ANTHROPIC_API_KEY before starting.
#   All other defaults work out of the box.
#
# Resource note (your hardware — RTX 3060, 96GB RAM, AMD Ryzen 9 3900X):
#   Redis:  ~50MB RAM
#   Worker: ~200MB RAM per instance (Python + eval-engine deps)
#   4 workers × 3 API calls each = 12 concurrent Anthropic API requests
#   Adjust WORKER_CONCURRENCY based on your Anthropic rate limits.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Redis — message broker and result backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eval_engine_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eval_net

  # ---------------------------------------------------------------------------
  # Celery worker — executes debate rounds
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: eval_engine_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:${REDIS_PORT:-6379}/0"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DRY_RUN: "${DRY_RUN:-false}"
      PROPOSER_MODEL: "${PROPOSER_MODEL:-claude-haiku-4-5}"
      CRITIC_MODEL: "${CRITIC_MODEL:-claude-sonnet-4-6}"
      JUDGE_MODEL: "${JUDGE_MODEL:-claude-haiku-4-5}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      OUTPUT_DIR: "/app/outputs"
    volumes:
      - ./outputs:/app/outputs
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
    command: >
      celery -A eval_engine.orchestration.celery_tasks worker
      --loglevel=${LOG_LEVEL:-info}
      --concurrency=${WORKER_CONCURRENCY:-4}
      --queues=debates
      --hostname=worker@%h
      --without-gossip
      --without-mingle
    networks:
      - eval_net
    deploy:
      resources:
        limits:
          memory: "${WORKER_MEMORY_LIMIT:-2g}"

  # ---------------------------------------------------------------------------
  # Flower — Celery task monitor (web UI)
  # Optional: comment out if not needed
  # Access at http://localhost:5555
  # ---------------------------------------------------------------------------
  flower:
    image: mher/flower:2.0
    container_name: eval_engine_flower
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: "redis://redis:${REDIS_PORT:-6379}/0"
      FLOWER_PORT: "5555"
      FLOWER_BASIC_AUTH: "${FLOWER_AUTH:-admin:eval_engine}"
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    networks:
      - eval_net
    profiles:
      - monitoring   # Only starts with: docker compose --profile monitoring up

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  eval_net:
    driver: bridge
