# configs/consolidation_eval_example.yaml
#
# Example: Consolidation-Based RAG Evaluation
# Pre/post consolidation delta — five-test suite
#
# Run: verity run --config configs/consolidation_eval_example.yaml

experiment_id: consolidation_delta_eval_run1
architecture: consolidation
model: claude-sonnet-4-6

dataset:
  path: datasets/eval_set.json
  format: json
  question_col: question
  context_col: contexts
  answer_col: answer
  ground_truth_col: ground_truth

metrics:
  # Test 1: RAGAS pre/post consolidation delta (PRIMARY)
  - name: ragas_consolidation_delta
    enabled: true
    pre_consolidation_snapshot: snapshots/pre_consolidation/
    post_consolidation_snapshot: snapshots/post_consolidation/

  # NDCG@10 (primary retrieval metric)
  - name: ndcg
    enabled: true
    k: 10

  # Safety filter reliability
  - name: llamaguard_safety
    enabled: true
    kwargs:
      mode: local
      quantize: true

  # Tests 2-5: uncomment to enable
  # - name: per_stage_ablation
  #   enabled: false
  # - name: threshold_compute_budget
  #   enabled: false
  # - name: single_session_poisoning
  #   enabled: false
  # - name: query_perturbation
  #   enabled: false

budget:
  max_usd: 5.00
  warn_at_pct: 0.80
  track_tokens: true

async_cfg:
  max_concurrent_queries: 10
  batch_size: 50
  timeout_seconds: 30.0

retry:
  max_retries: 3
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0
  retry_on_status: [429, 500, 502, 503]

statistics:
  tests: [wilcoxon, cohens_d]
  alpha: 0.05
  effect_size_threshold: 0.5
  save_figures: true
  figures_dir: outputs/figures

output_dir: outputs
notes: "Consolidation delta evaluation — primary run."
