[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.2.0"
description = "Verity Evaluation Engine — AI assurance and RAG evaluation infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aurelian Security", email = "cyberpsychguy@gmail.com" }]
keywords = ["RAG", "evaluation", "alignment", "LLM", "RAGAS", "security", "assurance", "trust", "calibration"]

dependencies = [
    "ragas>=0.1.9",
    "datasets>=2.14.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
safety = ["transformers>=4.40.0", "torch>=2.2.0"]
anthropic-backend = ["langchain-anthropic>=0.1.0"]
openai-backend = ["langchain-openai>=0.1.0"]
ollama-backend = ["langchain-ollama>=0.1.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.9.0"]

[project.scripts]
verity = "eval_engine.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["eval_engine/tests"]
